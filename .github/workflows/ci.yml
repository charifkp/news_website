name: CI & SonarQube

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unit-and-integration:
    name: Unit + Integration tests & SonarQube
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: implements/backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # จำเป็นสำหรับ SonarQube เพื่ออ่านประวัติ Git

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: implements/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm test -- --coverage

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }} # (ถ้าใช้ SonarCloud อาจจะไม่ต้องใส่ตัวนี้ หรือใส่ถ้ามี)
        with:
          args: >
            -Dsonar.host.url=https://sonarcloud.io

  # Runs the real stack (docker compose) + Playwright. Manual trigger only, because it needs
  # your compose file to boot MySQL + seed an admin account. Run it from the Actions tab.
  e2e:
    name: E2E tests (Playwright)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: docker compose -f implements/docker-compose.yml up -d --build
      - name: Wait for the site
        run: npx --yes wait-on http://localhost:3002 --timeout 120000
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        working-directory: implements/e2e
        run: npm ci && npx playwright install --with-deps chromium
      - name: Run E2E
        working-directory: implements/e2e
        run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: implements/e2e/playwright-report
