name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unit-and-integration:
    name: Unit + integration tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: implements/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: implements/backend/package-lock.json
      - run: npm ci
      - run: npm run test:cov
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: implements/backend/coverage

  # Runs the real stack (docker compose) + Playwright. Manual trigger only, because it needs
  # your compose file to boot MySQL + seed an admin account. Run it from the Actions tab.
  e2e:
    name: E2E tests (Playwright)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: docker compose -f implements/docker-compose.yml up -d --build
      - name: Wait for the site
        run: npx --yes wait-on http://localhost:3002 --timeout 120000
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        working-directory: implements/e2e
        run: npm ci && npx playwright install --with-deps chromium
      - name: Run E2E
        working-directory: implements/e2e
        run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: implements/e2e/playwright-report
