name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'implements/backend/**'
      - 'docker-compose.yml'

jobs:
  # เนื่องจากคุณไม่ต้องการ Deploy ผ่าน SSH แล้ว จึงเปลี่ยนสถานะให้ข้ามขั้นตอนนี้ไป 
  # หรือหากไม่ต้องการใช้งานไฟล์นี้เลย สามารถลบไฟล์ทิ้งจากโปรเจกต์ได้เลยครับ
  skip-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Skip SSH Deployment
        run: echo "SSH deployment has been disabled by user."
