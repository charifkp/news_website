name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'implements/frontend/**'

permissions:
  contents: read
  pages: write
  id-token: write

# อนุญาตให้ทำการ deployment ซ้อนทับกันได้ในกรณีที่ push ถี่ๆ
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: implements/frontend/package-lock.json

      - name: Install dependencies
        working-directory: implements/frontend
        run: npm ci

      - name: Build project
        working-directory: implements/frontend
        run: npm run build  # หรือคำสั่ง build ของโปรเจกต์คุณ (มักจะได้โฟลเดอร์ dist หรือ build ออกมา)

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # เปลี่ยน path ให้ชี้ไปที่โฟลเดอร์หลัง build เสร็จ (เช่น dist หรือ build) 
          # *ตรวจสอบชื่อโฟลเดอร์ build ในโปรเจกต์ของคุณอีกครั้งนะครับว่าชื่ออะไร*
          path: implements/frontend/dist 

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
