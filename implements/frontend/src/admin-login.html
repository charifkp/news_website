<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Sarabun', sans-serif;
      background: #0d2257;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-box {
      background: #fff;
      border-radius: 16px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }

    .logo {
      text-align: center;
      margin-bottom: 1.75rem;
    }

    .logo-icon {
      font-size: 40px;
      margin-bottom: 8px;
    }

    .logo-title {
      font-size: 18px;
      font-weight: 600;
      color: #0d2257;
    }

    .logo-sub {
      font-size: 13px;
      color: #888;
      margin-top: 3px;
    }

    .divider {
      border: none;
      border-top: 0.5px solid #e0e0e0;
      margin-bottom: 1.5rem;
    }

    .field {
      margin-bottom: 1rem;
    }

    .field label {
      display: block;
      font-size: 13px;
      color: #555;
      margin-bottom: 6px;
      font-weight: 500;
    }

    .field input {
      width: 100%;
      padding: 10px 14px;
      border: 0.5px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
      font-family: 'Sarabun', sans-serif;
      color: #1a1a1a;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .field input:focus {
      border-color: #185FA5;
      box-shadow: 0 0 0 3px rgba(24,95,165,0.12);
    }

    .field input.error {
      border-color: #E24B4A;
      box-shadow: 0 0 0 3px rgba(226,75,74,0.1);
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-right: 42px;
    }

    .toggle-pw {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #aaa;
      font-size: 16px;
      padding: 0;
      line-height: 1;
    }

    .toggle-pw:hover { color: #555; }

    .error-msg {
      display: none;
      align-items: center;
      gap: 6px;
      padding: 10px 12px;
      background: #fde8e8;
      border: 0.5px solid #f09595;
      border-radius: 8px;
      font-size: 13px;
      color: #A32D2D;
      margin-bottom: 1rem;
    }

    .btn-login {
      width: 100%;
      padding: 11px;
      background: #185FA5;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      font-family: 'Sarabun', sans-serif;
      cursor: pointer;
      transition: background 0.15s;
      margin-top: 0.25rem;
    }

    .btn-login:hover { background: #0C447C; }

    .btn-login:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    .back-link {
      text-align: center;
      margin-top: 1.25rem;
      font-size: 13px;
      color: #888;
    }

    .back-link a {
      color: #185FA5;
      text-decoration: none;
      font-weight: 500;
    }

    .back-link a:hover { text-decoration: underline; }

    .loading {
      display: none;
      text-align: center;
      font-size: 13px;
      color: #888;
      margin-top: 10px;
    }

    /* Demo hint */
    .demo-hint {
      margin-top: 1.25rem;
      padding: 10px 12px;
      background: #f0f6ff;
      border: 0.5px solid #b5d4f4;
      border-radius: 8px;
      font-size: 12px;
      color: #185FA5;
      line-height: 1.7;
    }

    .demo-hint strong { font-weight: 600; }
  </style>
</head>
<body>

  <div class="login-box">
    <div class="logo">
      <div class="logo-icon">📰</div>
      <div class="logo-title">News Admin</div>
      <div class="logo-sub">ระบบจัดการข่าวประชาสัมพันธ์</div>
    </div>

    <hr class="divider">

    <div class="error-msg" id="error-msg">
      ⚠️ ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง
    </div>

    <div class="field">
      <label for="username">ชื่อผู้ใช้</label>
      <input type="text" id="username" placeholder="กรอกชื่อผู้ใช้" autocomplete="username">
    </div>

    <div class="field">
      <label for="password">รหัสผ่าน</label>
      <div class="password-wrap">
        <input type="password" id="password" placeholder="กรอกรหัสผ่าน" autocomplete="current-password">
        <button class="toggle-pw" onclick="togglePw()" type="button" aria-label="แสดง/ซ่อนรหัสผ่าน">👁</button>
      </div>
    </div>

    <button class="btn-login" id="btn-login" onclick="doLogin()">เข้าสู่ระบบ</button>

    <div class="loading" id="loading">กำลังเข้าสู่ระบบ...</div>

    <div class="back-link">
      <a href="/index.html">← กลับหน้าหลัก</a>
    </div>

    <div class="demo-hint">
      🔑 <strong>Demo credentials:</strong><br>
      Username: <strong>admin</strong><br>
      Password: <strong>admin1234</strong>
    </div>
  </div>

  <script>
    // Demo credentials (in production replace with real auth)
    var ADMIN_USER = 'admin';
    var ADMIN_PASS = 'admin1234';

    // Where to go after login
    var REDIRECT_AFTER_LOGIN = '/upload.html';

    // If already logged in, redirect immediately
    if (sessionStorage.getItem('isAdmin') === 'true') {
      window.location.href = REDIRECT_AFTER_LOGIN;
    }

    function doLogin() {
      var username = document.getElementById('username').value.trim();
      var password = document.getElementById('password').value;
      var errMsg   = document.getElementById('error-msg');
      var loading  = document.getElementById('loading');
      var btn      = document.getElementById('btn-login');
      var uInput   = document.getElementById('username');
      var pInput   = document.getElementById('password');

      // Clear previous errors
      errMsg.style.display = 'none';
      uInput.classList.remove('error');
      pInput.classList.remove('error');

      if (!username || !password) {
        errMsg.textContent = '⚠️ กรุณากรอกชื่อผู้ใช้และรหัสผ่าน';
        errMsg.style.display = 'flex';
        if (!username) uInput.classList.add('error');
        if (!password) pInput.classList.add('error');
        return;
      }

      // Show loading state
      btn.disabled = true;
      btn.textContent = 'กำลังตรวจสอบ...';
      loading.style.display = 'block';

      // Simulate async check (replace with real API call)
      setTimeout(function () {
        if (username === ADMIN_USER && password === ADMIN_PASS) {
          // Save session
          sessionStorage.setItem('isAdmin', 'true');
          sessionStorage.setItem('adminUser', username);
          btn.textContent = '✓ เข้าสู่ระบบสำเร็จ';
          btn.style.background = '#3B6D11';
          loading.textContent = 'กำลังนำคุณไปยังหน้าจัดการข่าว...';
          setTimeout(function () {
            window.location.href = REDIRECT_AFTER_LOGIN;
          }, 800);
        } else {
          // Wrong credentials
          errMsg.textContent = '⚠️ ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง';
          errMsg.style.display = 'flex';
          uInput.classList.add('error');
          pInput.classList.add('error');
          btn.disabled = false;
          btn.textContent = 'เข้าสู่ระบบ';
          loading.style.display = 'none';
          document.getElementById('password').value = '';
        }
      }, 800);
    }

    function togglePw() {
      var input = document.getElementById('password');
      input.type = input.type === 'password' ? 'text' : 'password';
    }

    // Allow Enter key to submit
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') doLogin();
    });
  </script>

</body>
</html>
