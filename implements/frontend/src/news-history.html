<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ประวัติข่าว - สภานักศึกษา มหาวิทยาลัยมหิดล</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --blue:    #1a3f8f;
      --blue-dk: #0d2257;
      --blue-lt: #e8eef9;
      --white:   #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Sarabun', sans-serif;
      background: #f4f5f7;
      color: #1a1a1a;
    }

    /* ===== TOPBAR ===== */
    .topbar {
      background: var(--blue-dk);
      color: #fff;
      padding: 6px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
    }

    .topbar .social { display: flex; gap: 12px; align-items: center; }
    .topbar .social a { color: #fff; display: flex; align-items: center; }
    .topbar .social svg { width: 16px; height: 16px; }
    .topbar a { color: #fff; text-decoration: none; }
    .topbar a:hover { opacity: .75; }

    /* ===== NAVBAR ===== */
    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 32px;
      background: var(--white);
      border-bottom: 1px solid #e0e0e0;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }

    .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .logo-mark { font-size: 16px; font-weight: 700; color: var(--blue); }
    .logo-sub { font-size: 11px; color: #666; line-height: 1.4; }

    nav { display: flex; align-items: center; gap: 4px; }
    nav a {
      display: flex; align-items: center; gap: 5px;
      padding: 7px 12px;
      font-size: 14px;
      color: #333;
      text-decoration: none;
      border-radius: 8px;
      transition: background .15s, color .15s;
    }
    nav a:hover, nav a.active { background: var(--blue-lt); color: var(--blue); }
    nav a svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    /* ===== BREADCRUMB ===== */
    .breadcrumb {
      background: #fff;
      border-bottom: 0.5px solid #e0e0e0;
      padding: 8px 32px;
      font-size: 13px;
      color: #888;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .breadcrumb a { color: var(--blue); text-decoration: none; }
    .breadcrumb a:hover { text-decoration: underline; }

    /* ===== PAGE CONTENT ===== */
    .page-wrap { max-width: 900px; margin: 0 auto; padding: 2rem 1.5rem 3rem; }

    .page-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--blue-dk);
      margin-bottom: 6px;
    }

    .page-sub {
      font-size: 14px;
      color: #888;
      margin-bottom: 1.5rem;
    }

    /* ===== FILTER BAR ===== */
    .filter-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 1.75rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .search-box {
      flex: 1;
      min-width: 200px;
      padding: 9px 14px;
      border: 0.5px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
      font-family: 'Sarabun', sans-serif;
      outline: none;
      background: #fff;
    }

    .search-box:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(26,63,143,0.1); }

    .filter-select {
      padding: 9px 14px;
      border: 0.5px solid #ccc;
      border-radius: 8px;
      font-size: 13px;
      font-family: 'Sarabun', sans-serif;
      background: #fff;
      outline: none;
      cursor: pointer;
    }

    .result-count {
      font-size: 13px;
      color: #888;
      margin-left: auto;
      white-space: nowrap;
    }

    /* ===== YEAR GROUP ===== */
    .year-group { margin-bottom: 2rem; }

    .year-label {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 1rem;
    }

    .year-badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 16px;
      background: var(--blue-dk);
      color: #fff;
      border-radius: 99px;
      font-size: 14px;
      font-weight: 600;
    }

    .year-line {
      flex: 1;
      height: 1px;
      background: #e0e0e0;
    }

    .year-count {
      font-size: 12px;
      color: #aaa;
    }

    /* ===== NEWS ITEM ===== */
    .news-item {
      display: flex;
      gap: 14px;
      background: #fff;
      border: 0.5px solid #e8e8e8;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 10px;
      text-decoration: none;
      color: inherit;
      transition: box-shadow .15s, border-color .15s;
    }

    .news-item:hover {
      box-shadow: 0 4px 18px rgba(26,63,143,.1);
      border-color: #b5ccf0;
    }

    .news-thumb {
      width: 90px;
      height: 70px;
      border-radius: 8px;
      object-fit: cover;
      flex-shrink: 0;
      background: var(--blue-lt);
    }

    .news-thumb-placeholder {
      width: 90px;
      height: 70px;
      border-radius: 8px;
      flex-shrink: 0;
      background: var(--blue-lt);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }

    .news-body { flex: 1; min-width: 0; }

    .news-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 5px;
      flex-wrap: wrap;
    }

    .tag {
      display: inline-flex;
      padding: 2px 10px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 500;
      background: var(--blue-lt);
      color: var(--blue);
    }

    .news-date-small {
      font-size: 12px;
      color: #aaa;
    }

    .news-title {
      font-size: 14px;
      font-weight: 600;
      color: #1a1a1a;
      line-height: 1.4;
      margin-bottom: 4px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .news-desc {
      font-size: 13px;
      color: #666;
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* ===== EMPTY ===== */
    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: #aaa;
    }

    .empty-state .big { font-size: 40px; margin-bottom: 10px; }

    /* ===== FOOTER ===== */
    footer {
      background: var(--blue-dk);
      color: #ddd;
      text-align: center;
      padding: 20px;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      .navbar { padding: 10px 16px; }
      .page-wrap { padding: 1.25rem 1rem 3rem; }
      .news-thumb, .news-thumb-placeholder { width: 70px; height: 55px; }
      .filter-bar { gap: 8px; }
    }
  </style>
</head>
<body>

        displayYear: '2568',
        img: 'image/instagram/659591458_18090415328595564_8426637387155158581_n.webp'
      },
      {
        id: 3,
        tag: 'ประกาศ',
        title: 'ประกาศสภานักศึกษามหาวิทยาลัยมหิดล',
        desc: 'เรื่อง ประกาศรายชื่อสมาชิกสภานักศึกษามหาวิทยาลัยมหิดล ประจำปีวาระ 2569 (ฉบับไม่เป็นทางการ)',

      {

        title: 'แถลงการณ์ขอโทษ',
        desc: 'กรณีความผิดพลาดในลำดับการรับรองรายชื่อนักศึกษาสรรหาเพื่อดำรงตำแหน่งคณะกรรมการสโมสรนักศึกษามหาวิทยาลัยมหิดล ประจำปีการศึกษา 2569',
        date: '23 เม.ย. 2568',
        sortDate: '2025-04-23',
        displayYear: '2568',
        img: 'image/instagram/674395107_18088653500595564_8262444920406159664_n.webp'
      },
      {
        id: 5,
        tag: 'ประกาศ',
        title: 'นักศึกษามหิดลทุกคนเตรียมแอพ We Mahidol ให้พร้อม!',

      {

      // ตัวอย่างปี 2566
      {

        tag: 'กิจกรรม',
        title: 'โครงการค่ายอาสาพัฒนาชนบท ปี 2566',
        desc: 'สภานักศึกษาจัดโครงการค่ายอาสาพัฒนาชนบท เพื่อส่งเสริมจิตสาธารณะของนักศึกษา',

        img: ''
      },
      {
        id: 10,
        tag: 'ประกาศ',
        title: 'ประกาศรับสมัครสมาชิกสภานักศึกษา ปีการศึกษา 2566',
        desc: 'เปิดรับสมัครนักศึกษาที่มีความสนใจเข้ารับการคัดเลือกเป็นสมาชิกสภานักศึกษา',
        date: '1 เม.ย. 2566',
        sortDate: '2023-04-01',
        displayYear: '2566',
        img: ''
      },
    ];

    // ===== INIT =====
    function init() {
      // Sort by date descending
      NEWS.sort(function(a, b) { return b.sortDate.localeCompare(a.sortDate); });

      // Populate year filter
      var years = [...new Set(NEWS.map(function(n) { return n.displayYear; }))];
      var yearSel = document.getElementById('filter-year');
      years.forEach(function(y) {
        var opt = document.createElement('option');
        opt.value = y;
        opt.textContent = 'ปี ' + y;
        yearSel.appendChild(opt);
      });

      // Populate tag filter
      var tags = [...new Set(NEWS.map(function(n) { return n.tag; }))];
      var tagSel = document.getElementById('filter-tag');
      tags.forEach(function(t) {
        var opt = document.createElement('option');
        opt.value = t;
        opt.textContent = t;
        tagSel.appendChild(opt);
      });

      renderNews();
    }

    // ===== RENDER =====
    function renderNews() {
      var q       = document.getElementById('search-input').value.toLowerCase();
      var fYear   = document.getElementById('filter-year').value;
      var fTag    = document.getElementById('filter-tag').value;

      var filtered = NEWS.filter(function(n) {
        return (!q    || n.title.toLowerCase().includes(q) || n.desc.toLowerCase().includes(q) || n.tag.toLowerCase().includes(q))
            && (!fYear || n.displayYear === fYear)
            && (!fTag  || n.tag === fTag);
      });

      document.getElementById('result-count').textContent = 'พบ ' + filtered.length + ' ข่าว';

      var container = document.getElementById('news-container');

      if (filtered.length === 0) {
        container.innerHTML = '<div class="empty-state"><div class="big">📭</div>ไม่พบข่าวที่ค้นหา</div>';
        return;
      }

      // Group by year
      var groups = {};
      filtered.forEach(function(n) {
        if (!groups[n.displayYear]) groups[n.displayYear] = [];
        groups[n.displayYear].push(n);
      });

      var years = Object.keys(groups).sort(function(a, b) { return b - a; });

      container.innerHTML = years.map(function(year) {
        var items = groups[year];
        return '<div class="year-group">'
          + '<div class="year-label">'
          + '<span class="year-badge">พ.ศ. ' + year + '</span>'
          + '<div class="year-line"></div>'
          + '<span class="year-count">' + items.length + ' ข่าว</span>'
          + '</div>'
          + items.map(function(n) {
              var thumb = n.img
                ? '<img class="news-thumb" src="' + n.img + '" alt="" loading="lazy">'
                : '<div class="news-thumb-placeholder">📰</div>';
              return '<a class="news-item" href="' + (n.id <=5 ? '/news-detail.html?id=' + n.id : '#') + '">'
                + thumb
                + '<div class="news-body">'
                + '<div class="news-meta">'
                + '<span class="tag">' + n.tag + '</span>'
                + '<span class="news-date-small">' + n.date + '</span>'
                + '</div>'
                + '<div class="news-title">' + n.title + '</div>'
                + '<div class="news-desc">' + n.desc + '</div>'
                + '</div></a>';
            }).join('')
          + '</div>';
      }).join('');
    }

    init();
  </script>
